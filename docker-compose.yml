services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      POSTGRES_USER: jobnavigator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: jobnavigator
      TZ: ${TZ:-America/New_York}
      PGTZ: ${TZ:-America/New_York}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobnavigator"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    # Prebuilt on every release (ghcr.io, .github/workflows/images.yml): `docker compose pull`
    # skips the Chromium build. `docker compose up --build` still builds from source.
    image: ghcr.io/vesaias/jobnavigator-backend:${JN_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://jobnavigator:${POSTGRES_PASSWORD:-password}@db:5432/jobnavigator
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # One zone for crons, day buckets and the DB session (backend/tz.py)
      TZ: ${TZ:-America/New_York}
    ports:
      - "127.0.0.1:8000:8000"   # everything external goes through Caddy on :80; the raw API stays on loopback
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./backups:/app/backups
      - ./backend/.linkedin_api:/root/.linkedin_api
      - codex_auth:/root/.codex
      # agy keeps its OAuth token in a file here; no keyring in this image.
      - antigravity_auth:/root/.gemini

  searxng:
    image: searxng/searxng:2026.10.4-d48c4b555
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-jobnavigator-searxng}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    # Host-only: LM Studio (mcp-searxng) on this machine uses http://127.0.0.1:8888.
    # The backend reaches it as http://searxng:8080 on the compose network.
    ports:
      - "127.0.0.1:8888:8080"

  # MCP bridge so LM Studio (or any MCP client on this host) can search through SearXNG:
  # LM Studio mcp.json -> {"mcpServers": {"searxng": {"url": "http://127.0.0.1:3010/mcp"}}}
  mcp-searxng:
    image: isokoliuk/mcp-searxng:2.5.1
    restart: unless-stopped
    environment:
      SEARXNG_URL: http://searxng:8080
      MCP_HTTP_PORT: "3000"
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_ALLOWED_HOSTS: 127.0.0.1:3010,localhost:3010
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      - searxng

  frontend:
    image: ghcr.io/vesaias/jobnavigator-frontend:${JN_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # No published port: Caddy reaches this container over the compose network (frontend:80), and a
    # host port only invites clashes (Windows reserves ranges around 3000 for Hyper-V after a restart).
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  codex_auth:
  antigravity_auth:
