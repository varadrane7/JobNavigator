<!doctype html><html><meta charset="utf-8"><head><meta charset="utf-8"></head><head><title>Acme - Engineer</title></head><body>
<h1>Software Engineer</h1>
<form id="application-form">
  <div class="field"><label for="first_name">First Name *</label><input id="first_name" name="first_name" required></div>
  <div class="field"><label for="last_name">Last Name *</label><input id="last_name" name="last_name" required></div>
  <div class="field"><label for="email">Email *</label><input id="email" type="email" name="email" required></div>
  <div class="field"><label for="phone">Phone</label><input id="phone" type="tel" name="phone"></div>
  <div class="field"><label for="resume">Resume/CV *</label><button type="button">Attach</button><input id="resume" type="file" name="resume" required style="display:none"></div>
  <div class="field"><label for="question_1">LinkedIn Profile</label><input id="question_1" name="question_1"></div>
  <div class="field"><label for="question_2">Why do you want to work at Acme? *</label><textarea id="question_2" name="question_2" required></textarea></div>
  <div class="field"><label for="question_3">Are you legally authorized to work in the United States? *</label>
    <select id="question_3" name="question_3" required><option value="">Select...</option><option value="1">Yes</option><option value="0">No</option></select></div>
  <div class="field" data-combo='["Yes", "No"]'>
  <label id="question_4-label">Will you now or in the future require visa sponsorship? *</label>
  <input id="question_4" role="combobox" aria-labelledby="question_4-label" aria-controls="question_4-list" aria-expanded="false" autocomplete="off" aria-required="true">
  <div class="val select__placeholder">Select...</div>
  <div id="question_4-list" role="listbox" style="display:none"></div>
</div>
  <div class="field" data-combo='["Male", "Female", "Decline To Self Identify"]'>
  <label id="gender-label">Gender</label>
  <input id="gender" role="combobox" aria-labelledby="gender-label" aria-controls="gender-list" aria-expanded="false" autocomplete="off" >
  <div class="val select__placeholder">Select...</div>
  <div id="gender-list" role="listbox" style="display:none"></div>
</div>
  <div class="field"><label for="question_5">Which office would you prefer? *</label>
    <select id="question_5" name="question_5" required><option value="">Select...</option><option>New York</option><option>Remote</option></select></div>
  <div class="field"><label><input type="checkbox" name="consent" required> I acknowledge the privacy policy *</label></div>
  <p id="err"></p>
  <button type="submit">Submit application</button>
</form>

<script>
// Minimal ARIA combobox in the react-select mould: input[role=combobox] opens a listbox of
// [role=option]s; picking one renders a .select__single-value and closes the list.
document.querySelectorAll('[data-combo]').forEach(function (wrap) {
  var input = wrap.querySelector('input'), list = wrap.querySelector('[role=listbox]'), val = wrap.querySelector('.val');
  var opts = JSON.parse(wrap.getAttribute('data-combo'));
  function render(filter) {
    list.innerHTML = '';
    opts.filter(function (o) { return !filter || o.toLowerCase().indexOf(filter.toLowerCase()) >= 0; }).forEach(function (o) {
      var d = document.createElement('div'); d.setAttribute('role', 'option'); d.textContent = o;
      d.addEventListener('click', function () { val.textContent = o; val.className = 'val select__single-value'; wrap.dataset.value = o;
        list.style.display = 'none'; input.setAttribute('aria-expanded', 'false'); input.value = ''; });
      list.appendChild(d);
    });
  }
  function open() { render(input.value); list.style.display = 'block'; input.setAttribute('aria-expanded', 'true'); }
  input.addEventListener('mousedown', open); input.addEventListener('click', open);
  input.addEventListener('input', function () { render(input.value); list.style.display = 'block'; input.setAttribute('aria-expanded', 'true'); });
});
</script>

<script>
document.querySelector('form').addEventListener('submit', function (e) {
  e.preventDefault();
  var bad = Array.from(document.querySelectorAll('[required]')).filter(function (el) {
    if (el.type === 'file') return !el.files.length;
    if (el.type === 'radio') return !document.querySelector('input[name="' + el.name + '"]:checked');
    if (el.type === 'checkbox') return !el.checked;
    return !el.value; });
  var badCombo = Array.from(document.querySelectorAll('[data-combo]')).filter(function (w) { return w.querySelector('[aria-required]') && !w.dataset.value; });
  if (bad.length || badCombo.length) { var p = document.getElementById('err'); p.textContent = 'Missing: ' + bad.map(function (b) { return b.name || b.id; }).concat(badCombo.map(function (w) { return w.querySelector('input').id; })).join(', '); p.setAttribute('role', 'alert'); return; }
  var data = {}; Array.from(new FormData(e.target).entries()).forEach(function (kv) { data[kv[0]] = typeof kv[1] === 'string' ? kv[1] : kv[1].name; });
  document.querySelectorAll('[data-combo]').forEach(function (w) { data[w.querySelector('input').id] = w.dataset.value; });
  localStorage.setItem('submitted', JSON.stringify(data));
  location.href = '/gh/confirmation/';
});
</script>
</body></html>
