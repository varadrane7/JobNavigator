<!doctype html>
<html><head><meta charset="utf-8"><title>Software Engineer - Acme (Workday look-alike)</title>
<style>body{font-family:sans-serif;margin:24px} .hide{display:none} button{padding:6px 12px} label{display:block;margin-top:10px}</style>
</head><body>
<div id="app"></div>
<script>
const q = new URLSearchParams(location.search);
const app = document.getElementById('app');
const S = {step: 'job', data: {}};
if (q.get('seed') && !localStorage.getItem('wd_account')) {
  const [e, p] = q.get('seed').split(':');
  localStorage.setItem('wd_account', JSON.stringify({email: e, pw: p}));
}
function html(h) { app.innerHTML = h; }
function job() {
  html(`<h1>Software Engineer</h1><p>Acme Corp, Remote</p>
    <a href="#" role="button" data-automation-id="adventureButton" id="apply">Apply</a>`);
  document.getElementById('apply').onclick = (e) => { e.preventDefault(); chooser(); };
}
function chooser() {
  html(`<div role="dialog"><h2>Start Your Application</h2>
    <button data-automation-id="applyManually" id="manual">Apply Manually</button></div>`);
  document.getElementById('manual').onclick = () => (q.get('seed') || localStorage.getItem('wd_account')) ? signin() : create();
}
function create() {
  html(`<div data-automation-id="createAccountContent"><h2>Create Account</h2>
    <label for="email">Email Address</label><input id="email" data-automation-id="email" type="email">
    <label for="pw">Password</label><input id="pw" data-automation-id="password" type="password">
    <label for="vpw">Verify New Password</label><input id="vpw" data-automation-id="verifyPassword" type="password">
    <label><input type="checkbox" data-automation-id="createAccountCheckbox"> I agree to the terms</label>
    <p><button data-automation-id="createAccountSubmitButton" id="go">Create Account</button>
    <a href="#" data-automation-id="signInLink" id="sil">Sign In</a></p>
    <div data-automation-id="errorMessage" class="hide" id="err"></div></div>`);
  document.getElementById('sil').onclick = (e) => { e.preventDefault(); signin(); };
  document.getElementById('go').onclick = () => {
    const email = document.getElementById('email').value, pw = document.getElementById('pw').value;
    if (!email || pw !== document.getElementById('vpw').value) {
      const el = document.getElementById('err'); el.textContent = 'Passwords do not match'; el.classList.remove('hide'); return;
    }
    localStorage.setItem('wd_account', JSON.stringify({email, pw}));
    if (q.get('verify')) { html('<h2>Check your email</h2><p>We sent a verification email. Verify your email to continue.</p>'); return; }
    wizard(1);
  };
}
function signin() {
  html(`<div data-automation-id="signInContent"><h2>Sign In</h2>
    <label for="email">Email Address</label><input id="email" data-automation-id="email" type="email">
    <label for="pw">Password</label><input id="pw" data-automation-id="password" type="password">
    <p><button data-automation-id="signInSubmitButton" id="go">Sign In</button></p>
    <div data-automation-id="errorMessage" class="hide" id="err"></div></div>`);
  document.getElementById('go').onclick = () => {
    const acc = JSON.parse(localStorage.getItem('wd_account') || 'null');
    const email = document.getElementById('email').value, pw = document.getElementById('pw').value;
    if (acc && acc.email === email && acc.pw === pw) { wizard(1); return; }
    const el = document.getElementById('err'); el.textContent = 'Invalid email or password'; el.classList.remove('hide');
  };
}
function nav(label, onclick) {
  return `<div><button data-automation-id="bottom-navigation-next-button" id="next">${label}</button></div>`;
}
function wizard(n) {
  S.step = n;
  if (n === 1) {
    html(`<div data-automation-id="progressBar"></div><h2>My Information</h2>
      <label for="fn">First Name *</label><input id="fn" data-automation-id="legalNameSection_firstName" required aria-required="true">
      <label for="ln">Last Name *</label><input id="ln" data-automation-id="legalNameSection_lastName" required aria-required="true">
      <label for="em">Email *</label><input id="em" type="email" required aria-required="true">
      <label for="cv">Resume/CV</label><input id="cv" type="file" data-automation-id="file-upload-input-ref">
      <div data-automation-id="errorBanner" class="hide" id="banner"></div>
      ${nav('Save and Continue')}`);
    document.getElementById('next').onclick = () => {
      const fn = document.getElementById('fn').value, ln = document.getElementById('ln').value, em = document.getElementById('em').value;
      if (!fn || !ln || !em) { const b = document.getElementById('banner'); b.textContent = 'Errors found: complete the required fields'; b.classList.remove('hide'); return; }
      S.data.first = fn; S.data.last = ln; S.data.email = em;
      S.data.resume = (document.getElementById('cv').files[0] || {}).name || null;
      wizard(2);
    };
  } else if (n === 2) {
    html(`<div data-automation-id="progressBar"></div><h2>Application Questions</h2>
      <label for="auth">Are you legally authorized to work in the United States? *</label>
      <select id="auth" required aria-required="true"><option value="">Select One</option><option>Yes</option><option>No</option></select>
      <div data-automation-id="errorBanner" class="hide" id="banner"></div>
      ${nav('Save and Continue')}`);
    document.getElementById('next').onclick = () => {
      const v = document.getElementById('auth').value;
      if (!v) { const b = document.getElementById('banner'); b.textContent = 'Errors found: select an option'; b.classList.remove('hide'); return; }
      S.data.auth = v; wizard(3);
    };
  } else {
    html(`<div data-automation-id="progressBar"></div><h2>Review</h2><p>Check your answers, then submit.</p>${nav('Submit')}`);
    document.getElementById('next').onclick = () => {
      localStorage.setItem('submitted', JSON.stringify(S.data));
      html('<h2>Application Submitted</h2><p>Thank you for applying.</p>');
    };
  }
}
job();
</script></body></html>
